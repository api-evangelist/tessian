name: Tessian
description: >-
  Tessian, now part of Proofpoint, is an AI-powered email security platform that
  protects against inbound threats (phishing and impersonation), accidental data
  loss, and deliberate data exfiltration across its Defender, Guardian, Enforcer,
  Architect, and Constructor modules. The Tessian API is a RESTful, JSON,
  read-oriented interface that exports security-event, anomaly, company-risk,
  user-monitoring, audit-log, and trigger data into SIEMs and other data-management
  tools. It authenticates with a static API token, paginates by checkpoint, and
  returns ISO 8601 UTC timestamps.
