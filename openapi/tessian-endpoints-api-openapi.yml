openapi: 3.2.0
info:
  title: Tessian Endpoints API
  version: 1.0.1
  x-logo:
    url: data:image/png;base64,
    altText: Tessian Logo
  description: '# About the Tessian API

    The Tessian API provides access to your Tessian security event data and can be integrated with SIEMs and other data management tools.'
servers:
- url: https://your-domain.tessian-platform.com
  description: For companies hosted on tessian-platform.com.
- url: https://your-domain.tessian-app.com
  description: For companies hosted on tessian-app.com.
tags:
- name: Endpoints
paths:
  /api/v1/events:
    get:
      tags:
      - Endpoints
      summary: Security Events
      description: This endpoint provides security events from Defender, Guardian, and Architect.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/events\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: Only include events that were created after this time.
      - in: query
        name: limit
        description: The maximum number of events to return.
        schema:
          type: integer
          minimum: 2
          maximum: 100
          default: 100
      - in: query
        name: after_checkpoint
        schema:
          type: string
        description: 'If provided, this parameter must be set to the `checkpoint` returned by a previous request to this endpoint.  When provided, events from the previous request will not be included in the response from this request. If the new checkpoint returned by this request is used in yet another call to this endpoint events from both previous requests will not be included in the response (and so on). By making a number of consecutive requests to this endpoint where the checkpoint from the previous request is provided, clients can get all events from the Tessian platform, even when there are many more than can be returned in a single request. This process is often referred to as pagination.


          If an event is updated, it will no longer be excluded from subsequent requests.

          '
        required: false
      operationId: insights.external_api.main.get_events
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkpoint:
                    type: string
                    description: 'This value can be provided to a subsequent request via the `after_checkpoint` query parameter to ensure that events from this request are not returned in  future responses. This allows clients to paginate through results.

                      '
                  additional_results:
                    type: boolean
                    description: 'True if there may be more events that can be immediately retrieved. Note that there may be times when `additional_results` is true, but when you make a subsequent call you receive back zero results.

                      '
                  results:
                    type: array
                    description: Tessian security events.
                    items:
                      $ref: '#/components/schemas/Event'
                    minItems: 0
                    maxItems: 100
                required:
                - checkpoint
                - additional_results
                - results
          links:
            checkpoint:
              operationId: getEvents
              parameters:
                after_checkpoint: $response.body#/checkpoint
              description: A 'checkpoint' can be used to paginate through events.
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /reporting/anomalies/v1:
    get:
      tags:
      - Endpoints
      summary: Anomalies
      description: This endpoint provides the same information that is available on the Anomalous Activity page.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/reporting/anomalies/v1\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: query
        name: after_checkpoint
        description: 'Return only anomalies that were created after this one. Use with the output of the ''checkpoint''

          field to iteratively retrieve all anomalies from the API where the total exceeds the maximum

          query limit.

          '
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: The maximum number of anomalies to return.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        example: 100
      operationId: insights.external_api.main.get_anomalies
      responses:
        '200':
          description: Request was successfully processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - has_more
                - data
                properties:
                  status:
                    type: integer
                    description: The HTTP status of the response
                  has_more:
                    type: boolean
                    description: True if there are more anomalies that can be immediately retrieved.
                  data:
                    type: array
                    description: Returns the collection of anomalies that have been identified by the system.
                    items:
                      $ref: '#/components/schemas/Anomaly'
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /api/v1/monitoring/users:
    get:
      tags:
      - Endpoints
      summary: Users
      description: Provides the same information that is available on the User Monitoring page.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/monitoring/users\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: query
        name: after_checkpoint
        description: 'Use with the output of the ''checkpoint'' field to iteratively retrieve all

          users from the API where the total exceeds the maximum query limit.

          '
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: The maximum number of users to return.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        example: 100
      operationId: insights.external_api.main.get_users
      responses:
        '200':
          description: Request was successfully processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - checkpoint
                - additional_results
                - results
                properties:
                  checkpoint:
                    type: string
                    description: A checkpoint for retrieving further pages.
                  additional_results:
                    type: boolean
                    description: True if there are more users that can be retrieved.
                  results:
                    type: array
                    description: Returns the collection of monitored users.
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                          description: The user's email address
                        id:
                          type: integer
                          description: The identifier assigned to each user
                        sync_state:
                          $ref: '#/components/schemas/SyncState'
                        status:
                          $ref: '#/components/schemas/UserMonitoringStatus'
                        last_connection:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The [timestamp](#section/Timestamps) of when an email was most recently uploaded for the user via any method
                        emails_processed:
                          type: integer
                          description: Total count of emails uploaded that have been processed
                        addin_version:
                          type:
                          - string
                          - 'null'
                          description: Which version of the client-side Add-in made the last request
                        addin_hardware:
                          type:
                          - string
                          - 'null'
                          description: The machine name that the client-side Add-in was last running on
                        user_created:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: When the user was first seen by the Tessian system
                        last_upload_stored:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The [timestamp](#section/Timestamps) of the most recent e-mail that the user has uploaded
                        addin_ping:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The [timestamp](#section/Timestamps) of when an email was most recently uploaded for the user via the Add-in
                        addin_check:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The [timestamp](#section/Timestamps) of the most recent Tessian outbound check for the user via the Add-in
                        gateway_ping:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The [timestamp](#section/Timestamps) of when an email was most recently uploaded for the user via the Gateway
                        gateway_check:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The [timestamp](#section/Timestamps) of the most recent Tessian outbound check for the user via the Gateway
                        api_ping:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The [timestamp](#section/Timestamps) of when an email was most recently uploaded for the user via API syncing
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /api/v1/risk/company:
    get:
      tags:
      - Endpoints
      summary: Company Risks
      description: This endpoint provides the same information that is available on the Human Layer Risk Hub page.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/risk/company\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: query
        name: after_checkpoint
        description: 'Use with the output of the ''checkpoint'' field to iteratively retrieve all

          users from the API where the total exceeds the maximum query limit.

          '
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: The maximum number of days of risk data to return.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 1000
        example: 7
      operationId: insights.external_api.main.get_company_risk
      responses:
        '200':
          description: Request was successfully processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - checkpoint
                - additional_results
                - results
                properties:
                  checkpoint:
                    type: string
                    description: The cursor for pagination
                  additional_results:
                    type: boolean
                    description: Flag indicating that more results are available.
                  results:
                    type: array
                    description: The list of daily risk scores.
                    items:
                      $ref: '#/components/schemas/ScoresDatapoint'
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /api/v1/groups:
    get:
      tags:
      - Endpoints
      summary: Get Groups
      description: Fetch a list of all groups.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/groups\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      operationId: insights.external_api.main.endpoint_groups_read
      parameters:
      - in: query
        name: after_checkpoint
        description: 'Use with the output of the ''checkpoint'' field to iteratively retrieve all

          groups where the total exceeds the query limit.

          '
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: The maximum number of groups to return per page.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 1000
        example: 100
      responses:
        '200':
          description: Request was successfully processed
          content:
            application/json:
              schema:
                type: object
                required:
                - checkpoint
                - additional_results
                - groups
                properties:
                  checkpoint:
                    type: string
                    description: A token that can be used to get more groups.
                  additional_results:
                    type: boolean
                    description: True if there are more groups to retrieve.
                  groups:
                    description: An array of group information objects.
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupMetadata'
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
    post:
      tags:
      - Endpoints
      summary: Create Group
      description: Creates a group with the supplied name.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/groups\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n    json={\"name\": \"A new group\"},\n)\n\nprint(response.json())\n"
      operationId: insights.external_api.main.endpoint_group_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The name of the group to be created.
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: integer
                    description: The ID of the group created from this request.
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /api/v1/groups/{id}:
    get:
      tags:
      - Endpoints
      summary: Read Group
      description: Get information about a group.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\ngroup_id = \"73\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/groups/{group_id}\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: path
        name: id
        description: The ID of the group to query.
        required: true
        schema:
          type: integer
        example: 42
      - in: query
        name: after_checkpoint
        description: 'Use with the output of the ''checkpoint'' field to iteratively retrieve all

          members of the group where the total exceeds the query limit.

          '
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: The maximum number of group members to return per page.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 1000
        example: 100
      operationId: insights.external_api.main.endpoint_group_read
      responses:
        '200':
          description: Request was successfully processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - checkpoint
                - additional_results
                - results
                properties:
                  checkpoint:
                    type: string
                    description: A token that can be used to get more group members.
                  additional_results:
                    type: boolean
                    description: True if there are more group members to retrieve.
                  results:
                    description: The state of the group.
                    type: object
                    required:
                    - metadata
                    - members
                    properties:
                      metadata:
                        $ref: '#/components/schemas/GroupMetadata'
                      members:
                        $ref: '#/components/schemas/GroupMembers'
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
    put:
      tags:
      - Endpoints
      summary: Update a group
      description: Updates the group with the supplied information.
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\ngroup_id = \"73\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/groups/{group_id}\"\n\nresponse = requests.put(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n    json={\"name\": \"New name\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: path
        name: id
        description: The ID of the group to update.
        required: true
        schema:
          type: integer
        example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Fields to write
              required:
              - name
              properties:
                name:
                  type: string
      operationId: insights.external_api.main.endpoint_group_update
      responses:
        '200':
          description: Request was successfully processed
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
    delete:
      tags:
      - Endpoints
      summary: Delete a group
      description: 'Delete a group.

        Caveat — all deletions are final; a deleted group cannot be recovered.'
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\ngroup_id = \"73\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/groups/{group_id}\"\n\nresponse = requests.delete(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: path
        name: id
        description: The ID of the group to delete.
        required: true
        schema:
          type: integer
        example: 42
      operationId: insights.external_api.main.endpoint_group_delete
      responses:
        '200':
          description: Request was successfully processed
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /api/v1/groups/{id}/add_members:
    post:
      tags:
      - Endpoints
      summary: Add group members
      description: 'Incremental update: the members listed in the request are added to the

        group''s current members.'
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\ngroup_id = \"73\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/groups/{group_id}/add_members\"\n\nresponse = requests.post(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n    json={\n        \"members\": [\n            {\"address\": \"john@example.com\"},\n            {\"address\": \"sarah@example.com\"},\n        ]\n    },\n)\n\nprint(response.json())\n"
      parameters:
      - in: path
        name: id
        description: The ID of the group to add members to.
        required: true
        schema:
          type: integer
        example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  $ref: '#/components/schemas/GroupMembers'
      operationId: insights.external_api.main.endpoint_group_update_add
      responses:
        '200':
          description: Request was successfully processed
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /api/v1/groups/{id}/remove_members:
    post:
      tags:
      - Endpoints
      summary: Remove group members
      description: 'Incremental update: the members listed in the request are removed from

        the group''s current members.'
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\ngroup_id = \"73\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/groups/{group_id}/remove_members\"\n\nresponse = requests.post(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n    json={\n        \"members\": [\n            {\"address\": \"john@example.com\"},\n            {\"address\": \"sarah@example.com\"},\n        ]\n    },\n)\n\nprint(response.json())\n"
      parameters:
      - in: path
        name: id
        description: The ID of the group to remove members from.
        required: true
        schema:
          type: integer
        example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  $ref: '#/components/schemas/GroupMembers'
      operationId: insights.external_api.main.endpoint_group_update_remove
      responses:
        '200':
          description: Request was successfully processed
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
  /reporting/triggers/v1:
    get:
      tags:
      - Endpoints
      deprecated: true
      summary: Triggers
      description: '**⚠️ Scheduled for removal after Jan 2023.'
      parameters:
      - in: query
        name: start_date
        description: 'The start of the period of interest, expressed in UTC. The API will return triggers whose `timestamp` field is on or after this date.  You may also receive a small number of triggers from just before this date.


          Note that this parameter is needed only **once**, the first time the API is called. After that, you should send `after_checkpoint` instead.

          '
        required: false
        schema:
          type: string
          format: date
          example: '2019-11-15'
      - in: query
        name: after_checkpoint
        description: 'Return only triggers that were updated after this one. At least one of ''start_date''

          and ''after_checkpoint'' is required.

          '
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: The maximum number of triggers to return.
        required: false
        schema:
          type: integer
          format: int32
        example: 100
      operationId: insights.external_api.main.get_triggers
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nurl = \"https://your-subdomain.tessian-platform.com/reporting/triggers/v1\"\n\nparameters = {\n    \"start_date\": \"2019-11-15\",\n    \"limit\": 100,\n}\n\nheaders = {\n    \"Authorization\": \"API-Token your-api-token\",\n}\n\nresponse = requests.get(\n    url,\n    headers=headers,\n    params=parameters,\n)\n"
      responses:
        '200':
          description: Request was successfully processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The HTTP status of the response
                  has_more:
                    type: boolean
                    description: True if there are more triggers that can be immediately retrieved.
                  data:
                    type: array
                    description: The list of triggers.
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/GuardianTrigger'
                      - $ref: '#/components/schemas/EnforcerTrigger'
                      - $ref: '#/components/schemas/ConstructorTrigger'
                      - $ref: '#/components/schemas/ArchitectTrigger'
                      - $ref: '#/components/schemas/DefenderTrigger'
                      discriminator:
                        propertyName: module
                        mapping:
                          guardian: '#/components/schemas/GuardianTrigger'
                          defender: '#/components/schemas/DefenderTrigger'
                          enforcer: '#/components/schemas/EnforcerTrigger'
                          constructor: '#/components/schemas/ConstructorTrigger'
                          architect: '#/components/schemas/ArchitectTrigger'
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
components:
  schemas:
    Event:
      oneOf:
      - $ref: '#/components/schemas/GuardianEvent'
      - $ref: '#/components/schemas/ArchitectEvent'
      - $ref: '#/components/schemas/DefenderEvent'
      discriminator:
        propertyName: type
        mapping:
          guardian: '#/components/schemas/GuardianEvent'
          architect: '#/components/schemas/ArchitectEvent'
          defender: '#/components/schemas/DefenderEvent'
    OutboundTrigger:
      description: 'Represents a trigger for one of the outbound modules

        '
      allOf:
      - $ref: '#/components/schemas/Trigger'
      - type: object
        properties:
          priority:
            description: 'A heuristic value that indicates how confident Tessian Guardian is that this trigger

              represents a risky event (closer to 1 represents higher confidence).

              '
            type:
            - number
            - 'null'
            minimum: 0
            maximum: 1
          alert_type:
            description: The type of trigger response set by the administrator.
            type: string
            enum:
            - block
            - silent
            - warn
            - quarantine
          initial_response:
            type: string
            description: 'How the user responded to the Tessian warning message (if it was shown).

              '
          subsequent_action:
            type: string
            description: 'The user''s subsequent action after responding to the Tessian warning message

              (if any).

              '
          changes_made:
            type: string
            description: 'Changes made to the email (if it was initally not sent, but subsequently sent with

              changes).

              '
          final_outcome:
            type: string
            description: 'The final outcome of the email.

              '
          salutation_extracted:
            type: string
            description: The salutation used by the sender in the triggered email.
            example: hello
          project_identifiers:
            type: array
            description: Any terms present that could refer to a project / potentially sensitive information.
            items:
              type: string
            example:
            - zebra
            - tornado
          check_performed_by:
            type: string
            description: 'Whether the check was performed via the Tessian Add-in or the Tessian Gateway.

              '
            enum:
            - Tessian Add-in
            - Tessian Gateway
            example: Tessian Gateway
          tracking_id:
            type: string
            description: 'The value of the x-ts-tracking-id field in the email (or an empty string if none).

              '
            example: ABCD.1
    GuardianEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - $ref: '#/components/schemas/OutboundEmailDetails'
      - type: object
        properties:
          guardian_details:
            type: object
            description: Details about the Guardian trigger.
            properties:
              triggered_filter_ids:
                type: array
                description: The IDs of all the Guardian filters that triggered.
                items:
                  type: string
              type:
                type: string
                enum:
                - MISDIRECTED_EMAIL
                - MISATTACHED_FILE
                description: The type of Guardian event.
              triggered_filter_names:
                type: array
                description: 'The names of all of the Guardian filters that triggered (at the time the event was retrieved).

                  '
                items:
                  type: string
              breach_prevented:
                type: boolean
                description: True if Guardian prevented this email from being sent.
              anomalous_recipients:
                type: array
                items:
                  type: string
                  anyOf:
                  - format: email
                  - format: x.400
                description: "The recipient email addresses that Guardian has identified as being possible mistakes. \n"
              suggested_recipients:
                type: array
                items:
                  type: string
                  anyOf:
                  - format: email
                  - format: x.400
                description: 'The email addresses that Guardian thinks the user should be sending the email to.

                  '
              anomalous_attachments:
                type: array
                description: The name(s) of the email attachment(s) Guardian identified as misattached.
                items:
                  type: string
              final_outcome:
                type:
                - string
                - 'null'
                description: 'The final outcome of the email or `null` if the final outcome is not yet known.

                  '
                enum:
                - null
                - NOT_SENT
                - SENT_WITH_CHANGES
                - SENT_WITHOUT_CHANGES
              user_responses:
                type: array
                description: 'How the user responded to the Tessian warnings associated with this event.

                  '
                items:
                  type: string
                  enum:
                  - SEND
                  - DO_NOT_SEND
              justifications:
                type: array
                description: Any justifications the user wrote when choosing to send the email.
                items:
                  type: string
              user_shown_message:
                type: boolean
                description: '`true` if the user was shown a message for this event, `false` if not.

                  '
            required:
            - triggered_filter_ids
            - type
            - triggered_filter_names
            - breach_prevented
            - anomalous_recipients
            - suggested_recipients
            - anomalous_attachments
            - final_outcome
            - user_responses
            - justifications
            - user_shown_message
        required:
        - guardian_details
    DefenderEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - $ref: '#/components/schemas/InboundEmailDetails'
      - type: object
        properties:
          defender_details:
            type: object
            description: Details about the Defender trigger.
            properties:
              burst_attack_id:
                type: string
                description: An identifier for the burst attack this event is part of.
              intent_types:
                type: array
                description: The intent types that indicate phishing that Defender found in the email.
                items:
                  type: string
                  enum:
                  - INVOICE
                  - CREDENTIALS
                  - INFORMATION_THEFT
                  - BLACKMAIL
                  - SUSPICIOUS_URL
                  - SUSPICIOUS_ATTACHMENT
                  - URGENCY
              threat_signal_types:
                type: array
                description: The types of threat signals that Defender found in the email.
                items:
                  type: string
              threat_types:
                type: array
                description: The types of attacks detected by Defender.
                items:
                  type: string
                  enum:
                  - DIRECT_SPOOF_IMPERSONATION
                  - OTHER_PHISHING
                  - MATCHED_DENYLIST
                  - LOOKALIKE_IMPERSONATION
                  - BRAND_IMPERSONATION
                  - ACCOUNT_TAKEOVER
              spf_result:
                type:
                - string
                - 'null'
                enum:
                - PASSED
                - FAILED
                - null
                description: The result of SPF or `null` if the result is not known.
              dkim_result:
                type:
                - string
                - 'null'
                enum:
                - PASSED
                - FAILED
                - null
                description: The result of DKIM or `null` if the result is not known.
              dmarc_result:
                type:
                - string
                - 'null'
                enum:
                - PASSED
                - FAILED
                - null
                description: The result of DMARC or `null` if the result is not known.
              sender_location:
                type:
                - string
                - 'null'
                description: 'A human readable description of the geographical location the email was sent from or `null` if the location is not known.

                  '
              users_responded:
                type: object
                description: How the end users interacted with the email.
                properties:
                  malicious:
                    type: integer
                    minimum: 0
                    description: 'The number of users who indicated that they thought this email was malicious using the buttons in the Tessian warning.

                      '
                  safe:
                    type: integer
                    minimum: 0
                    description: 'The number of users who indicated that they thought this email was safe using the buttons in the Tessian warning.

                      '
                  unsure:
                    type: integer
                    minimum: 0
                    description: "The number of users who indicated that they were not sure if this email was malicious or safe using the buttons in the Tessian warning. \n"
                  deleted:
                    type: integer
                    minimum: 0
                    description: 'The number of users who deleted the email without otherwise indicating if they thought the email was malicious or safe.

                      '
                required:
                - malicious
                - safe
                - unsure
                - deleted
              number_protected_users:
                type: integer
                minimum: 0
                description: "The number of recipients of this email that are included in a filter that is  actively protecting them (e.g. not only silently tracked). \n"
              confidence:
                type: string
                enum:
                - VERY_HIGH
                - HIGH
                - MEDIUM
                - LOW
                description: How sure Defender is that this email is phishing.
              impersonation_type:
                type:
                - string
                - 'null'
                enum:
                - INTERNAL
                - EXTERNAL
                - null
                description: '`INTERNAL` if Defender believes your organization''s domain is being impersonated. `EXTERNAL` if Defender believes your external counterparties or suppliers are being impersonated. If Defender has not identified the email as an impersonation this field will be `null`.

                  '
              impersonated_domain:
                type:
                - string
                - 'null'
                description: 'The domain that Defender believes is being impersonated or `null` if no domain is being impersonated.

                  '
              impersonated_address:
                type:
                - string
                - 'null'
                description: 'The email address that Defender believes is being impersonated or `null` if no address is being impersonated.

                  '
            required:
            - burst_attack_id
            - intent_types
            - threat_signal_types
            - threat_types
            - spf_result
            - dkim_result
            - dmarc_result
            - sender_location
            - users_responded
            - number_protected_users
            - confidence
            - impersonation_type
            - impersonated_domain
            - impersonated_address
        required:
        - defender_details
    EnforcerTrigger:
      description: Represents a trigger by the Enforcer module
      allOf:
      - $ref: '#/components/schemas/OutboundTrigger'
      - type: object
        properties:
          module:
            type: string
            description: The module name
            enum:
            - enforcer
          unauthorised_recipients:
            description: 'Recipients Enforcer has identified as being unauthorized, non-business contacts (third-parties, personal email addresses).

              '
            type: array
            items:
              type: string
              format: email
              example: person@example.com
          unauthorized_email_prevented:
            type: boolean
            description: True if Enforcer prevented this email from being sent.
          email_is_sensitive:
            type: boolean
            description: True when Enforcer has identified this email as containing sensitive information.
          request_for_override:
            type:
            - boolean
            - 'null'
            description: True when the user requested to override the Enforcer warning and send the email.
          justification_for_override:
            type: string
            description: The text that the user typed when requesting to override the Enforcer warning and send the email.
    OutboundEmailDetails:
      type: object
      properties:
        outbound_email_details:
          allOf:
          - type: object
            description: Details about an outbound email.
            properties:
              send_time:
                type: string
                format: date-time
                description: The time that the email was sent or a send attempt was made in UTC.
              tessian_action:
                type: string
                enum:
                - WARN
                - BLOCK
                - SILENTLY_TRACK
                description: 'The action Tessian took when the user tried to send the email. If multiple modules triggered, the action might be the result of another module (i.e. not the module described by this event).

                  '
            required:
            - send_time
            - tessian_action
          - $ref: '#/components/schemas/BaseEmailDetails'
      required:
      - outbound_email_details
    GroupMetadata:
      type: object
      description: 'Information about a group.

        '
      required:
      - name
      properties:
        name:
          type: string
        id:
          type: integer
        created_at:
          type:
          - string
          - 'null'
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          readOnly: true
    DomainMember:
      type: object
      additionalProperties: false
      required:
      - domain
      properties:
        domain:
          type: string
          pattern: ^@.+
    BaseEmailDetails:
      type: object
      description: Details about an email.
      properties:
        message_id:
          type:
          - string
          - 'null'
          description: 'The email''s Message-ID. This field is `null` if no Message-ID was ever assigned to the email (for example if the Tessian outlook addin prevented the email from ever being sent).

            '
        tessian_id:
          type: string
          description: "A unique identifier assigned to the email by Tessian. Similar in concept to an email's Message-ID except it is guaranteed to always be assigned (even if the email was never sent). \n"
        from:
          description: The email address the email was from.
          type: string
          anyOf:
          - format: email
          - format: x.400
        transmitter:
          description: 'The email address that transmitted the email. In most cases this will be the same as  `from` but may differ if someone sent an email on behalf of someone else.

            '
          type: string
          anyOf:
          - format: email
          - format: x.400
        reply_to:
          type: array
          items:
            type: string
            anyOf:
            - format: email
            - format: x.400
          description: 'The email''s reply-to addresses. May be empty if there are no reply-to addresses, which implies replies will be sent  to the `from` address.

            '
        recipients:
          type: object
          description: The recipients of the email.
          properties:
            to:
              type: array
              description: The email addresses listed in the emails `TO` field.
              items:
                type: string
                anyOf:
                - format: email
                - format: x.400
            cc:
              type: array
              description: The email addresses listed in the emails `CC` field.
              items:
                type: string
                anyOf:
                - format: email
                - format: x.400
            bcc:
              type: array
              description: The email addresses listed in the emails `BCC` field.
              items:
                type: string
                anyOf:
                - format: email
                - format: x.400
            all:
              type: array
              description: The email addresses listed in the emails `TO`, `CC` and `BCC` fields.
              items:
                type: string
                anyOf:
                - format: email
                - format: x.400
            count:
              type: integer
              description: "The total number of recipients in the email. In this context, we treat a recipient as an email address in the `TO`, `CC` or `BCC` field. Specifically, distribution lists are not expanded. \n"
              minimum: 0
          required:
          - to
          - cc
          - bcc
          - all
          - count
        subject:
          type: string
          description: The subject of the email.
        attachments:
          type: object
          description: Details about the email attachments.
          properties:
            names:
              type: array
              description: The names of all the email attachments.
              items:
                type: string
            count:
              type: integer
              description: The number of attachments the email has.
              minimum: 0
            bytes:
              type: integer
              description: The total size of all attachments in bytes.
              minimum: 0
          required:
          - names
          - count
          - bytes
      required:
      - message_id
      - tessian_id
      - from
      - transmitter
      - reply_to
      - recipients
      - subject
      - attachments
    ConstructorTrigger:
      description: Represents a trigger by the Constructor module (legacy)
      allOf:
      - $ref: '#/components/schemas/OutboundTrigger'
      - type: object
        properties:
          module:
            type: string
            description: The module name
            enum:
            - constructor
          internal_external:
            type: string
            description: '* "internal" = The email was sent only to internal recipients.

              * "external" = The email was sent only to external recipients.

              * "both" = The email was sent both internal and external recipients.

              '
            enum:
            - internal
            - external
            - both
          triggered_recipients:
            type: array
            items:
              type: string
            description: Any recipients that were identified and subsequently triggered a Constructor filter.
            example:
            - example2@example.com
            - example3@example.com
          triggered_keywords:
            type: array
            items:
              type: string
            description: Any keywords that were identified and subsequently triggered a Constructor filter.
            example:
            - tornado
            - zebra
    BaseEvent:
      type: object
      description: Properties that all events have.
      properties:
        id:
          type: string
          description: A unique identifier for the event.
        type:
          type: string
          description: The type of event.
        created_at:
          type: string
          format: date-time
          description: When the event was created in UTC.
        updated_at:
          type: string
          format: date-time
          description: When the event was last updated in UTC. Creation is counted as an update.
        portal_link:
          type:
          - string
          - 'null'
          format: url
          description: 'A HTTP link to the Tessian portal where further information about to this event can be viewed.

            '
      required:
      - id
      - type
      - created_at
      - updated_at
      - portal_link
    UserMonitoringStatus:
      description: How well we have been connecting with the user
      type: string
      enum:
      - Good connection
      - Connection issues
      - Not connected for over 7 days
      - Not connected for over 1 month
    ScoresDatapoint:
      description: risk drivers
      type: object
      required:
      - timestamp
      - total_score
      - phishing_score
      - exfiltration_score
      - accidental_data_loss_score
      - data_sensitivity_score
      - security_awareness_score
      properties:
        timestamp:
          type: string
          format: date
          description: Timestamp of the datapoint.
        total_score:
          type: number
          description: Overall risk score.
          format: float
          minimum: 1
          maximum: 100
        phishing_score:
          type: number
          description: 'The risk of employees being tricked by phishing attacks leading to business email compromise, credential theft, data loss, or malware.

            '
          format: float
          minimum: 1
          maximum: 100
        exfiltration_score:
          type: number
          description: 'The risk of employees exfiltrating sensitive data to non-business accounts

            outside of the organization.

            '
          format: float
          minimum: 1
          maximum: 100
        accidental_data_loss_score:
          type: number
          description: 'The risk of employees accidentally leaking sensitive data outside of the organization.

            '
          format: float
          minimum: 1
          maximum: 100
        data_sensitivity_score:
          type: number
          description: 'The risk associated with the sensitivity and volume of data shared by employees

            outside the organization.

            '
          format: float
          minimum: 1
          maximum: 100
        security_awareness_score:
          type: number
          description: 'The risk associated with employee security awareness, which includes employee engagement with security warnings, number of security warnings and number of exfiltration attempts.

            '
          format: float
          minimum: 1
          maximum: 100
    ArchitectEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - $ref: '#/components/schemas/OutboundEmailDetails'
      - type: object
        properties:
          architect_details:
            type: object
            description: Details about the Architect trigger.
            properties:
              triggered_policy_ids:
                type: array
                minItems: 1
                description: The IDs of all the architect policies that triggered.
                items:
                  type: string
              triggered_policy_names:
                type: array
                minItems: 1
                description: 'The names of all the architect policies (at the time the event was created) that triggered.

                  '
                items:
                  type: string
              triggered_logic_types:
                type: array
                minItems: 1
                description: 'The types of conditions and exceptions that triggered across all architect policies. If multiple conditions or exceptions of the same type triggered, the type is only listed once here.

                  '
                items:
                  type: string
              breach_prevented:
                type:
                - boolean
                - 'null'
                description: 'True if Architect prevented this email from being sent. `null` if it has not yet been determined.

                  '
              final_outcome:
                type:
                - string
                - 'null'
                description: 'The final outcome of the email. `null` if it has not yet been determined.

                  '
                enum:
                - NOT_SENT
                - SENT_WITH_CHANGES
                - SENT_WITHOUT_CHANGES
              user_responses:
                type: array
                description: 'How the user responded to the Tessian warnings associated with this event.

                  '
                items:
                  type: string
                  enum:
                  - SEND
                  - DO_NOT_SEND
              is_sensitive:
                type: boolean
                description: Indicates if the email is considered sensitive.
              justifications:
                type: array
                description: Any justifications the user wrote when choosing to send the email.
                items:
                  type: string
              user_shown_message:
                type: boolean
                description: '`true` if the user was shown a message for this event, `false` if not.

                  '
            required:
            - triggered_policy_ids
            - triggered_policy_names
            - triggered_logic_types
            - breach_prevented
            - final_outcome
            - user_responses
            - is_sensitive
            - justifications
            - user_shown_message
        required:
        - architect_details
    Attachment:
      description: Details about an attachment
      type: object
      properties:
        attachment:
          description: Name of the attachment
          type: string
          example: Untitled document
        encrypted:
          description: Is the attachment encrypted
          type: boolean
    ArchitectTrigger:
      description: Represents a trigger by the Architect module
      allOf:
      - $ref: '#/components/schemas/OutboundTrigger'
      - type: object
        properties:
          module:
            type: string
            description: The module name
            enum:
            - architect
          triggered_keywords:
            type: array
            items:
              type: string
            description: Any keywords that were identified and subsequently triggered an Architect filter.
            example:
            - tornado
            - zebra
          justification:
            type: string
            description: The 'justification' text that the user entered when choosing to send the email.
          email_is_sensitive:
            type: boolean
            description: True when this email contains sensitive information.
          policy_breach_prevented:
            type: boolean
            description: True if Architect prevented this email from being sent.
    SyncState:
      description: How far along in the onboarding process the user is
      type: string
      enum:
      - Live
      - Onboarding
      - Queued
      - Out of date
    Links:
      description: Contains URLs that are associated with this event.
      type: object
      properties:
        portal_url:
          description: The address on the portal where further information related to this event can be viewed.
          type:
          - string
          - 'null'
          format: url
          example: https://example.tessian-platform.com/0/anomalies/916ab7bb-efa2-4b61-b7f3-7f45fb9c8f72
      additionalProperties: false
    GuardianTrigger:
      description: Represents a trigger for the Guardian module
      allOf:
      - $ref: '#/components/schemas/OutboundTrigger'
      - type: object
        properties:
          module:
            type: string
            description: The module name
            enum:
            - guardian
          guardian_event_type:
            type: string
            description: The type of the guardian trigger event.
            enum:
            - misdirected_email
            - misattached_file
          misdirected_email_prevented:
            type: boolean
            description: True if Guardian prevented this email from being sent due to being flagged as misdirected.
            example: true
          flag_reason:
            type: string
            description: The reason that Guardian flagged this email as being misdirected.
          anomalous_recipient:
            type: string
            description: The recipient email address that Guardian has identified as being a possible mistake.
            example: example2@example.com
          suggested_recipient:
            type: string
            description: The recipient that Guardian thinks the user should be sending the email to, based on the user's historical relationship with the suggested recipient.
            example: example3@example.com
          misattached_file_prevented:
            type: boolean
            description: True if Guardian prevented this email from being sent due to being flagged as having a misattached file.
            example: false
          misattached_file_reasons:
            type: array
            items:
              type: string
            description: The reasons that Guardian thinks this email has misattached files.
          anomalous_attachments:
            type: array
            items:
              type: string
            description: The email attachment names that Guardian has identified as being misattached.
            example:
            - project_483_document.pdf
    Trigger:
      type: object
      properties:
        module:
          type: string
          description: The module name
          enum:
          - guardian
          - defender
          - enforcer
          - constructor
          - architect
        filter_name:
          type: string
          description: Name of the filter that was triggered
          example: 'Filter #1'
        user:
          description: The individual user account protected by Tessian
          type: string
          format: email
          example: example@example.com
        timestamp:
          description: 'The date and time of the email, in UTC. This is the time that the email was sent (for inbound emails) or the time that the user attempted to send it (in the case of outbound emails). For more detailed documentation and format description, refer to [Timestamp](#section/Timestamps).

            '
          type: string
          format: date-time
          example: '2018-02-14T17:58:55.253005Z'
        recipients:
          description: All recipients of the email.
          type: array
          items:
            type: string
            format: email
          example:
          - example2@example.com
          - example3@example.com
          - example4@example.com
        to_recipients:
          description: 'to: recipients of the email.'
          type: array
          items:
            type: string
            format: email
          example:
          - example2@example.com
        cc_recipients:
          description: 'cc: recipients of the email.'
          type: array
          items:
            type: string
          example:
          - example3@example.com
        bcc_recipients:
          description: 'bcc: recipients of the email.'
          type: array
          items:
            type: string
          example:
          - example3@example.com
        subject:
          description: The subject line of the email.
          type: string
          example: Hello, World
        message_id:
          description: The identifier assigned to each email
          type: string
          format: uuid
          example: 916ab7bb-efa2-4b61-b7f3-7f45fb9c8f72
        number_of_attachments:
          type: integer
          description: The total number of attachments in the email.
          minimum: 0
          example: 1
        attachments_total_size:
          type: number
          format: float
          description: The total size of all attachments, in megabytes.
          minimum: 0
          example: 1.23
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Details of each attachment
        message_shown_to_user:
          type: string
          description: 'The Tessian warning message that was shown to the user. If ''alert_type'' is set to

            ''silent'' or ''quarantine'', then this is the message that **would** have been shown to

            the user, if it was set to ''warn'' or ''block''.

            '
        updated_at:
          description: The date and time when this trigger was last modified, in UTC.
          type: string
          format: date-time
          example: '2019-10-28 10:59:54.990272'
        trigger_id:
          type: string
          description: 'Uniquely idenfies this trigger, across multiple updates. You should dedupe the

            triggers returned by this API by their trigger_id, keeping only the last row

            (by updated_at time).


            The format of trigger_ids might change in the future. Also note that trigger_ids can

            be compared for equality but can''t be used on their own to order triggers

            chronologically.

            '
          example: 121555-442
        checkpoint:
          type: string
          description: 'Use this value in the ''after_checkpoint'' parameter of your next API call, to get

            back only triggers that have been modified after this one.


            The format of checkpoints might change in the future. They should not be used

            for comparing or ordering triggers.

            '
        links:
          $ref: '#/components/schemas/Links'
    InboundEmailDetails:
      type: object
      properties:
        inbound_email_details:
          allOf:
          - type: object
            description: Details about an inbound email.
            properties:
              received_time:
                type: string
                format: date-time
                description: The time that the email was received by the delivering mail server in UTC.
              urls:
                type: array
                items:
                  type: string
                description: The URLs extracted from the email.
            required:
            - received_time
            - urls
          - $ref: '#/components/schemas/BaseEmailDetails'
      required:
      - inbound_email_details
    Anomaly:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: A UUID identifying this anomaly. Each anomaly has a unqiue identifier.
          example: 916ab7bb-efa2-4b61-b7f3-7f45fb9c8f72
        links:
          $ref: '#/components/schemas/Links'
        address:
          type: string
          description: The email address of the individual that triggered the anomalous activity detection.
          example: another.user@example.com
        severity_label:
          type: string
          description: The severity classification for the anomalous activity.
          enum:
          - moderate
          - high
          - very_high
        anomalous_period_start:
          type: string
          description: The date and time of the start of the period of anomalous activity.
          format: date-time
          example: '2018-02-14T10:58:55.253005Z'
        anomalous_period_end:
          type: string
          description: The date and time of the end of the period of anomalous activity.
          format: date-time
          example: '2018-02-14T10:58:55.253005Z'
        attachment_count:
          type: integer
          minimum: 0
          description: The total number of attachments that were sent during the anomaly.
        trigger_ids:
          type: array
          items:
            type: string
          description: 'A trigger ID uniquely identifies an email associated with this anomaly. A list of all related emails is provided.

            The format of trigger_ids might change in the future. Also note that trigger_ids can be compared for equality but can''t be used on their own to order triggers chronologically.

            '
          example:
          - 83023-102
          - 49284-197
          - 58222-85
        checkpoint:
          type: string
          description: 'Use this value in the ''after_checkpoint'' parameter of your next API call, to get back only anomalies that have been created after this one.

            The format of checkpoints might change in the future. They should not be used for comparing or ordering anomalies.

            '
    AddressMember:
      type: object
      additionalProperties: false
      required:
      - address
      properties:
        address:
          type: string
          format: email
          pattern: ^(?!@).+
    DefenderTrigger:
      description: Represents a trigger by the Defender module
      allOf:
      - $ref: '#/components/schemas/Trigger'
      - type: object
        properties:
          module:
            type: string
            description: The module name
            enum:
            - defender
          threat_classification:
            type: string
            description: 'Defender analyzes all email communications and classifies them based on each email''s perceived danger.

              The emails representing the most dangerous threats are classified as ''malicious''; other emails are

              classified as ''anomalous''.

              '
            enum:
            - malicious
            - anomalous
          threat_types:
            description: 'The type of each attack detected by Defender.

              ''Unusual Email'' is semantically the same as ''Other Phishing'', which is used in other parts of the platform.

              '
            type: array
            items:
              type: string
              enum:
              - Direct Spoof Impersonation
              - Display Name Impersonation
              - Domain Impersonation
              - Unusual Email
              - Blacklist
              - Account Takeover
          threat_details:
            description: 'Additional information about each extracted threat. This may include information such as

              the positioning of any threat within the email itself, or which domain was being impersonated.

              '
            type: array
            items:
              type: string
          user_interaction:
            type: string
            description: 'The action the user took after seeing the Defender warning. (Action tracking is currently only available in the Tessian Outlook Add-in.)

              '
            enum:
            - deleted_email
            - marked_as_malicious
            - marked_as_safe
            - no_action
            - warning_message_not_shown
            - marked_as_unsure
            - marked_as_unsure_and_deleted
            - defender_not_enabled
            - silently_track
            - warning_message_not_shown_deleted
          urls:
            type: array
            items:
              type: string
            description: The URLs extracted from the email.
            example: http://www.example.com
          sender_display_name_and_address:
            type: string
            description: The email sender's display name and address, as seen by the email's recipients.
            example: Alice Smith <alice@example.com>
          reply_to_address:
            type: string
            description: 'The reply-to address, if specified by the sender. The reply-to address is the email address to which the email will be sent to if a recipient replies to the email. The reply-to address causes the user''s reply to go to a different email address, not to the original sender.

              '
            example: bob@example.com
          impersonation_type:
            type: string
            description: 'An Internal Impersonation is an impersonation of your organization''s domains or employees.

              An External Impersonation is an impersonation of your external counterparties or suppliers. This field only appears

              in Display Name, Domain, and Direct Spoof Impersonations.

              '
            enum:
            - internal
            - external
            - ''
          impersonated_domain:
            type: string
            description: 'The domain that Defender believes is being impersonated. This field only appears in certain impersonations.

              '
            example: other-example.com
          impersonated_address:
            type: string
            description: 'The email address that Defender believes is being impersonated. This field only appears in certain impersonations.

              '
            example: example1@example.com
          header:
            type: string
            description: 'The content of the email header. This is invisible to users, and contains information on the email''s sender,

              the recipient, authentication details, and other information.

              '
          email_summary:
            type: string
            description: A summary of the email components that triggered the Defender filter.
          intents:
            type: array
            items:
              type: string
              enum:
              - wire transfer
              - url present
              - attachment present
              - credential theft
              - information theft
              - general
              - urgency
              - shortened url present
            description: 'Intents describe how the potential attacker has tried to deceive the email''s recipient.

              Defender analyzes each email''s subject line and body text to determine the attacker''s intent.

              '
    GroupMembers:
      description: 'Input members data for adding/removing members from group,

        expects one of `address` or `domain`

        '
      type: array
      minItems: 1
      maxItems: 100
      items:
        oneOf:
        - $ref: '#/components/schemas/AddressMember'
        - $ref: '#/components/schemas/DomainMember'
