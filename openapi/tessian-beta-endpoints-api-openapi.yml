openapi: 3.2.0
info:
  title: Tessian Beta Endpoints API
  version: 1.0.1
  x-logo:
    url: data:image/png;base64,
    altText: Tessian Logo
  description: '# About the Tessian API

    The Tessian API provides access to your Tessian security event data and can be integrated with SIEMs and other data management tools.'
servers:
- url: https://your-domain.tessian-platform.com
  description: For companies hosted on tessian-platform.com.
- url: https://your-domain.tessian-app.com
  description: For companies hosted on tessian-app.com.
tags:
- name: Beta Endpoints
paths:
  /api/v1/audits:
    get:
      tags:
      - Beta Endpoints
      summary: Audit Logs
      description: '_⚠️ This endpoint is in Beta_


        This endpoint provides the same information that is available on the Audit Trail page.'
      x-codeSamples:
      - lang: Python
        source: "import requests\n\nsubdomain = \"YOUR_SUBDOMAIN\"\napi_token = \"YOUR_TOKEN\"\n\nurl = f\"https://{subdomain}.tessian-platform.com/api/v1/audits\"\n\nresponse = requests.get(\n    url,\n    headers={\"Authorization\": f\"API-Token {api_token}\"},\n)\n\nprint(response.json())\n"
      parameters:
      - in: query
        name: after_checkpoint
        description: 'Return only audit entries that were created after the checkpoint. Use with the output

          of the ''checkpoint'' field to iteratively retrieve all audit entries from the API

          where the total exceeds the maximum query limit.

          '
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: The maximum number of audit entries to return per page.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 1000
        example: 100
      operationId: insights.external_api.main.get_audits
      responses:
        '200':
          description: Request was successfully processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - checkpoint
                - additional_results
                - results
                properties:
                  checkpoint:
                    type: string
                    description: A token that can be used to get more audit entries.
                  additional_results:
                    type: boolean
                    description: True if there are more audit entries that can be immediately retrieved.
                  results:
                    type: array
                    description: Returns the audit entries in chronological order.
                    items:
                      $ref: '#/components/schemas/AuditEvent'
        '400':
          description: There was a problem with the request
        '401':
          description: There was a problem with the request
        '403':
          description: Invalid token or API is not enabled
        '429':
          description: Rate limited - wait a few seconds and try again
        '500':
          description: Server error
        '503':
          description: Server error
        '504':
          description: Server error
components:
  schemas:
    AuditEvent:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: 'The time the event took place, in UTC.

            '
        type:
          type: string
          description: The type of the event.
          example: Permissions Granted
        category:
          type: string
          description: 'The category this event belongs to. Logically similar events will all belong to the same category

            '
          example: User Management
        details:
          type: string
          description: Human-readable description of the event.
          example: The moon is now "full" (was "waxing gibbous")
        user:
          type: string
          format: email
          description: The email address of the user who triggered the event.
          example: alice@example.com
        ip:
          type: string
          oneOf:
          - format: ipv4
          - format: ipv6
          description: The IP address of the client who triggered the event.
          example: 1.2.3.4
      required:
      - timestamp
      - type
      - category
      - details
x-tagGroups:
- name: Endpoints
  tags:
  - Events
  - Groups
  - Monitoring
  - Risk
  - Anomalies
- name: Beta Endpoints
  tags:
  - Audits
- name: Deprecated Endpoints
  tags:
  - Deprecated
