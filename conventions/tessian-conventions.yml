    description: Set to the `checkpoint` value returned by the previous call to fetch the next page.
  - name: limit
    description: Maximum number of items to return (may return fewer, or zero, while has_more is true).
  - name: created_after
    description: Only include records created after this ISO 8601 timestamp.
  response_fields:
  - checkpoint
  - has_more
  guidance: >-
    Do not count returned rows to decide whether to continue; always rely on
    the `has_more` flag. has_more may be true even when zero rows are returned.
deduplication:
  note: >-
    The same event can be returned multiple times as new fields become
    available. Deduplicate on the `id` field, keeping the row with the latest
    `updated_at`.
